<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AniRacers — Kart Animal Reference</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#1a1a2e;overflow:hidden;font-family:system-ui,sans-serif}
  canvas{display:block}
  #labels{position:fixed;bottom:12px;left:0;right:0;display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:0 8px}
  .lbl{color:#f5e6c8;font-size:11px;text-align:center;min-width:140px}
  .lbl b{display:block;font-size:13px;letter-spacing:.5px}
  .lbl span{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:middle;margin-right:4px;border:1px solid rgba(255,255,255,.3)}
  #title{position:fixed;top:14px;left:0;right:0;text-align:center;color:#ffd33d;font-size:18px;font-weight:700;letter-spacing:1px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #sub{position:fixed;top:38px;left:0;right:0;text-align:center;color:#aaa;font-size:11px}
</style>
</head>
<body>
<div id="title">ANIRACERS — KART ANIMALS (current in-game models)</div>
<div id="sub">Exact voxel drivers from makeDriver() · top row = front 3/4 · bottom row = side profile</div>
<div id="labels"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// copied verbatim from index.html makeDriver + makeKart (minus scene.add)
function makeDriver(type){
  const d=new THREE.Group();
  const M=c=>new THREE.MeshLambertMaterial({color:c});
  const bx=(w,h,dd,x,y,z,c)=>{
    const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,dd),M(c));
    m.position.set(x,y,z); m.castShadow=true; d.add(m); return m;
  };
  if(type==='chicken'){
    bx(.95,.85,.75, 0,1.5,0, 0xf5f5f0);
    bx(.18,.5,.62,  .58,1.5,0, 0xe6e6dc);
    bx(.18,.5,.62, -.58,1.5,0, 0xe6e6dc);
    bx(.62,.6,.62,  0,2.28,.05, 0xf5f5f0);
    bx(.22,.16,.32, 0,2.24,.46, 0xf2a200);
    bx(.16,.24,.14, 0,1.99,.42, 0xd92b1c);
    bx(.18,.22,.5,  0,2.68,.05, 0xd92b1c);
    bx(.09,.09,.05,  .19,2.4,.37, 0x111111);
    bx(.09,.09,.05, -.19,2.4,.37, 0x111111);
    bx(.3,.22,.18,  0,1.45,-.45, 0xe6e6dc);
  }
  else if(type==='dog'){
    bx(.95,.85,.72, 0,1.5,0, 0x8d5a2b);
    bx(.62,.58,.6,  0,2.27,.05, 0x8d5a2b);
    bx(.34,.26,.32, 0,2.13,.46, 0xa9713a);
    bx(.15,.12,.1,  0,2.23,.63, 0x111111);
    bx(.14,.06,.18, 0,1.99,.5,  0xe06070);
    bx(.16,.44,.3,  .39,2.28,0, 0x5e3a18);
    bx(.16,.44,.3, -.39,2.28,0, 0x5e3a18);
    bx(.1,.1,.05,   .17,2.42,.36, 0x111111);
    bx(.1,.1,.05,  -.17,2.42,.36, 0x111111);
    bx(.14,.14,.55, 0,1.65,-.55, 0x8d5a2b);
  }
  else if(type==='sheep'){
    bx(1.05,.9,.85, 0,1.5,0, 0xf0ede2);
    bx(.3,.3,.3,   .45,1.95,.2, 0xfaf7ec);
    bx(.3,.3,.3,  -.45,1.95,-.15, 0xfaf7ec);
    bx(.32,.32,.32, .1,2.0,-.35, 0xfaf7ec);
    bx(.55,.55,.58, 0,2.25,.18, 0x4a4a4a);
    bx(.68,.26,.5,  0,2.6,.02, 0xf0ede2);
    bx(.3,.14,.2,   .42,2.32,.12, 0x3a3a3a);
    bx(.3,.14,.2,  -.42,2.32,.12, 0x3a3a3a);
    bx(.3,.2,.12,   0,2.1,.49, 0x6b6b6b);
    bx(.09,.09,.05,  .15,2.36,.48, 0xffffff);
    bx(.09,.09,.05, -.15,2.36,.48, 0xffffff);
  }
  else if(type==='frog'){
    bx(.92,.7,.72, 0,1.45,0, 0x4caf50);
    bx(.6,.45,.12,  0,1.42,.36, 0xd8e8b0);
    bx(.72,.45,.6,  0,2.0,.05, 0x4caf50);
    bx(.24,.24,.24,  .23,2.36,.12, 0xf5f5f0);
    bx(.24,.24,.24, -.23,2.36,.12, 0xf5f5f0);
    bx(.11,.11,.06,  .23,2.38,.26, 0x111111);
    bx(.11,.11,.06, -.23,2.38,.26, 0x111111);
    bx(.5,.06,.07,   0,1.92,.36, 0x2e6b30);
    bx(.16,.42,.16,  .5,1.28,.2, 0x43a047);
    bx(.16,.42,.16, -.5,1.28,.2, 0x43a047);
    bx(.3,.16,.3,    .52,1.12,-.25, 0x43a047);
    bx(.3,.16,.3,   -.52,1.12,-.25, 0x43a047);
  }
  else {
    bx(.9,.8,.7,   0,1.5,0, 0xe08a3c);
    bx(.6,.55,.58, 0,2.25,.05, 0xe08a3c);
    bx(.18,.24,.12, .2,2.62,.02, 0xe08a3c);
    bx(.18,.24,.12,-.2,2.62,.02, 0xe08a3c);
    bx(.1,.14,.06,  .2,2.6,.07, 0xd06080);
    bx(.1,.14,.06, -.2,2.6,.07, 0xd06080);
    bx(.3,.18,.16,  0,2.1,.38, 0xf0d8c0);
    bx(.1,.08,.06,  0,2.2,.47, 0xd06080);
    bx(.1,.09,.05,  .17,2.37,.35, 0x2fb344);
    bx(.1,.09,.05, -.17,2.37,.35, 0x2fb344);
    bx(.42,.03,.03, .42,2.12,.4, 0xf5f5f0);
    bx(.42,.03,.03,-.42,2.12,.4, 0xf5f5f0);
    bx(.12,.12,.7,  .3,1.5,-.55, 0xe08a3c);
    bx(.92,.1,.14, 0,1.78,.1, 0xb96a25);
    bx(.62,.08,.12, 0,2.5,.05, 0xb96a25);
  }
  d.position.set(0,0,-.5);
  return d;
}
function makeKart(bodyColor, animal){
  const g=new THREE.Group();
  const bm=new THREE.MeshLambertMaterial({color:bodyColor});
  const body=new THREE.Mesh(new THREE.BoxGeometry(2.2,.7,3.8),bm);
  body.position.y=.75; body.castShadow=true; g.add(body);
  const hood=new THREE.Mesh(new THREE.BoxGeometry(1.8,.45,1.2),bm);
  hood.position.set(0,1.2,1.1); hood.castShadow=true; g.add(hood);
  const spoiler=new THREE.Mesh(new THREE.BoxGeometry(2.4,.18,.6),new THREE.MeshLambertMaterial({color:0x222}));
  spoiler.position.set(0,1.45,-1.8); g.add(spoiler);
  for(const s of [-1,1]){
    const post=new THREE.Mesh(new THREE.BoxGeometry(.15,.5,.15),bm);
    post.position.set(s*.9,1.2,-1.8); g.add(post);
  }
  g.add(makeDriver(animal));
  const wg=new THREE.CylinderGeometry(.55,.55,.5,12);
  const wm=new THREE.MeshLambertMaterial({color:0x1c1c1c});
  for(const [x,z] of [[-1.25,1.3],[1.25,1.3],[-1.25,-1.3],[1.25,-1.3]]){
    const w=new THREE.Mesh(wg,wm);
    w.rotation.z=Math.PI/2; w.position.set(x,.55,z); w.castShadow=true;
    g.add(w);
  }
  return g;
}
const ANIMALS=[
  {type:'chicken', name:'CLUCK',    color:0xe3342f},
  {type:'dog',     name:'REX',      color:0x2fb344},
  {type:'sheep',   name:'WOOLY',    color:0x2f6fe3},
  {type:'cat',     name:'WHISKERS', color:0xf2c200},
  {type:'frog',    name:'HOPPER',   color:0x7b3fb5}
];
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x2a3a5c);
scene.fog=new THREE.Fog(0x2a3a5c,40,80);
const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.1,200);
camera.position.set(0,8,30);
camera.lookAt(0,1.5,-.5);
const sun=new THREE.DirectionalLight(0xfff5e0,1.1);
sun.position.set(8,18,12); sun.castShadow=true; scene.add(sun);
scene.add(new THREE.AmbientLight(0x6688bb,.45));
scene.add(new THREE.HemisphereLight(0x88aacc,0x334455,.35));
const floor=new THREE.Mesh(
  new THREE.PlaneGeometry(60,20),
  new THREE.MeshLambertMaterial({color:0x3d5a3d})
);
floor.rotation.x=-Math.PI/2; floor.position.y=0; floor.receiveShadow=true; scene.add(floor);
const grid=new THREE.GridHelper(60,30,0x556655,0x445544);
grid.position.y=.01; scene.add(grid);
const labels=document.getElementById('labels');
const spacing=7.5;
ANIMALS.forEach((a,i)=>{
  const kart=makeKart(a.color,a.type);
  kart.position.set((i-2)*spacing,0,4);
  kart.rotation.y=Math.PI*.12;
  scene.add(kart);
  const side=makeKart(a.color,a.type);
  side.position.set((i-2)*spacing,0,-5);
  side.rotation.y=Math.PI*.55;
  scene.add(side);
  const hex='#'+a.color.toString(16).padStart(6,'0');
  const lbl=document.createElement('div');
  lbl.className='lbl';
  lbl.innerHTML=`<b>${a.name}</b><span style="background:${hex}"></span>${a.type.toUpperCase()}`;
  lbl.style.marginLeft=(i===0?'':'0');
  labels.appendChild(lbl);
});
function loop(){
  requestAnimationFrame(loop);
  renderer.render(scene,camera);
}
loop();
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
